name: Android CI

# 每次推到 main 就跑：编译 + 单测，顺手把 debug APK 挂出来。
# 目的只有一个 —— 别让「本地没 SDK 所以没编译」成为发版前的盲区。
on:
  push:
    branches: [ main ]
    # 发版流程会自己提交 version.json / release-notes，别为这两个文件再跑一遍全量构建
    paths-ignore:
      - 'version.json'
      - 'release-notes/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 platform 34 与 build-tools
        # 不用 android-actions/setup-android@v3：它会去装已下架的 "tools" 包，
        # 在 cmdline-tools 16 上直接报 "Failed to find package 'tools'"。
        # GitHub 的 ubuntu runner 本来就带 SDK，直接用现成的 sdkmanager 补包即可。
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMAN="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMAN" ]; then
            echo "找不到 sdkmanager，SDK 目录内容："
            ls -R "$SDK_ROOT/cmdline-tools" | head -50
            exit 1
          fi
          echo "使用 $SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # 仓库里的 local.properties 写的是作者本机路径 /opt/android-sdk，
          # 不覆盖的话 Gradle 会去找一个不存在的目录
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: 打包 debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            sample-plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
