name: Android CI

# 每次推到 main 就跑：编译 + 单测，顺手把 debug APK 挂出来。
# 目的只有一个 —— 别让「本地没 SDK 所以没编译」成为发版前的盲区。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v3

      - name: 安装 platform 34 与 build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 指向 CI 的 SDK
        # 仓库里的 local.properties 写的是作者本机路径 /opt/android-sdk，
        # 不覆盖的话 Gradle 会去找一个不存在的目录
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: 打包 debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            sample-plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
