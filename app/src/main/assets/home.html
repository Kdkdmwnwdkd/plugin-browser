<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>插件浏览器</title>
<style>
  :root{
    --bg:#fafafa; --card:#f2f2f5; --line:rgba(19,19,22,.08);
    --text:#131316; --muted:#6a6a73; --faint:#9c9ca4; --accent:#3d5bd9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c0c0e; --card:#17171a; --line:rgba(255,255,255,.055);
      --text:#f2f2f4; --muted:#8b8b93; --faint:#6b6b73; --accent:#6e8bff;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;padding:0 24px 18px;
    -webkit-user-select:none;user-select:none;
  }

  /* 品牌：全页唯一重心，其余元素都让位 */
  .brand{
    margin-top:9vh;display:flex;align-items:center;gap:9px;
    font-size:25px;font-weight:650;letter-spacing:-.02em;
  }
  .brand svg{width:25px;height:25px;color:var(--accent);flex:0 0 25px}

  /* 快捷入口：4×2，统一 56dp，字母与标签同一套字号 */
  .grid{
    margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);
    gap:24px 10px;
  }
  a{
    text-decoration:none;color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .tile{
    width:60px;height:60px;border-radius:19px;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:21px;font-weight:600;letter-spacing:-.01em;color:var(--muted);
    transition:transform .18s ease,border-color .18s ease;
  }
  a:active .tile{transform:scale(.95)}
  a span.label{font-size:12px;color:var(--muted);letter-spacing:.01em}

  /* 提示：一行，把用户引导到唯一的输入口 */
  .hint{
    margin-top:52px;text-align:center;
    font-size:11.5px;line-height:1.7;color:var(--faint);
  }
  .hint b{color:var(--muted);font-weight:600}
</style>
</head>
<body>

  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/>
    </svg>
    插件浏览器
  </div>

  <div class="grid">
    <a href="https://www.baidu.com"><span class="tile">百</span><span class="label">百度</span></a>
    <a href="https://www.bilibili.com"><span class="tile">B</span><span class="label">哔哩哔哩</span></a>
    <a href="https://www.zhihu.com"><span class="tile">知</span><span class="label">知乎</span></a>
    <a href="https://www.taobao.com"><span class="tile">淘</span><span class="label">淘宝</span></a>
    <a href="https://weibo.com"><span class="tile">博</span><span class="label">微博</span></a>
    <a href="https://github.com"><span class="tile">G</span><span class="label">GitHub</span></a>
    <a href="https://www.douyin.com"><span class="tile">抖</span><span class="label">抖音</span></a>
    <a href="https://map.baidu.com"><span class="tile">图</span><span class="label">地图</span></a>
  </div>

  <div class="hint">
    点上方 <b>地址栏</b> 输入网址或搜索词
  </div>

<script>
  // 点空白处直接聚焦顶部地址栏：全页只有一个输入口，这里只负责把手指引过去
  document.body.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    location.href = 'pb://focus-address';
  });
</script>
</body>
</html>
