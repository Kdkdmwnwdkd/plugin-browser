<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>青鸢</title>
<style>
  :root{
    --bg:#FAFAFA; --text:#17181B; --muted:#71757F; --faint:#9AA0AA;
    --line:#E7E8EB; --edge:#D9DBE0; --soft:#F6F6F7; --accent:#1E4FD8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E0F12; --text:#E4E5EA; --muted:#A0A1AB; --faint:#6E717A;
      --line:#2A2C32; --edge:#34363D; --soft:#1A1B1F; --accent:#7E9BFF;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;padding:26px 24px 20px;
    -webkit-user-select:none;user-select:none;
  }

  /* 小标签：唯一一处「标题」，不放大字号，靠字距和颜色区分层级 */
  .lbl{
    font-size:11px;letter-spacing:1.4px;font-weight:700;
    color:var(--faint);text-transform:uppercase;
  }

  /* 搜索框：直角、1px 描边。整页只有这一个输入口，点它就等于点地址栏 */
  .sbox{
    margin-top:12px;height:50px;background:var(--bg);
    border:1px solid var(--edge);
    display:flex;align-items:center;gap:10px;padding:0 14px;
    color:var(--faint);font-size:14.5px;
    transition:border-color .18s ease;
  }
  .sbox:active{border-color:var(--muted)}
  .sbox svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}

  /* 站点：四列等分，46dp 直角块。圆角会让它看起来像应用图标，这里是「入口」不是「应用」 */
  .sites{
    margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);
    gap:24px 8px;
  }
  a{
    text-decoration:none;color:var(--text);
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .tile{
    width:46px;height:46px;background:var(--soft);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:#454952;
  }
  @media (prefers-color-scheme: dark){ .tile{color:#C6C9D1} }
  a:active .tile{background:var(--line)}
  a .nm{font-size:11px;color:#5A5E68;letter-spacing:-.1px;white-space:nowrap}
  @media (prefers-color-scheme: dark){ a .nm{color:var(--muted)} }

  /* 底部：把「怎么开始」放在视线尽头，不抢中间那条搜索框 */
  .foot{
    margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:11px;color:var(--faint);
  }
</style>
</head>
<body>

  <div class="lbl">新标签页</div>

  <div class="sbox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16 L20.5 20.5"/></svg>
    搜索或输入网址
  </div>

  <div class="sites">
    <a href="https://www.baidu.com"><span class="tile">百</span><span class="nm">百度</span></a>
    <a href="https://www.bilibili.com"><span class="tile">B</span><span class="nm">哔哩哔哩</span></a>
    <a href="https://www.zhihu.com"><span class="tile">知</span><span class="nm">知乎</span></a>
    <a href="https://www.taobao.com"><span class="tile">淘</span><span class="nm">淘宝</span></a>
    <a href="https://weibo.com"><span class="tile">博</span><span class="nm">微博</span></a>
    <a href="https://github.com"><span class="tile">G</span><span class="nm">GitHub</span></a>
    <a href="https://www.douyin.com"><span class="tile">抖</span><span class="nm">抖音</span></a>
    <a href="https://map.baidu.com"><span class="tile">图</span><span class="nm">地图</span></a>
  </div>

  <div class="foot">
    <span>青鸢 2.10.0</span>
    <span>点上方地址栏开始</span>
  </div>

<script>
  // 点空白处直接聚焦顶部地址栏：全页只有一个输入口，这里只负责把手指引过去
  document.body.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    location.href = 'pb://focus-address';
  });
</script>
</body>
</html>
